<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SW SR</title>
<style>
/* 亮色是基色;暗色只在 prefers-color-scheme 里覆盖同一批 token,数值
 * 全部来自 dataviz 技能的已校验默认色板(四类别色取 slot 1-4:蓝/橙/青/黄,
 * 相邻 CVD ΔE ≥ 8、常人 ΔE ≥ 15 都过线 —— 旧的手选配色在暗色下
 * gigpo/hgpo 两色 ΔE 只有 0.85,色弱基本分不出来)。 */
:root{
  --bg:#f9f9f7; --panel:#fcfcfb; --line:#e1e0d9; --axis:#c3c2b7;
  --fg:#0b0b0b; --fg2:#52514e; --dim:#898781;
  --grpo:#2a78d6; --gigpo:#eb6834; --hgpo:#1baf7a; --spectral:#eda100;
  --extra1:#8a5cd6; --extra2:#d6539a; --extra3:#2aa8c4;
  --run:#1baf7a; --wait:#b9862c; --bad:#d1483e; --done:#8a8981;
  --crit:#d03b3b;                 /* 状态色,固定,不跟着类别色板走 */
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0d0d; --panel:#1a1a19; --line:#2c2c2a; --axis:#383835;
    --fg:#ffffff; --fg2:#c3c2b7; --dim:#898781;
    --grpo:#3987e5; --gigpo:#d95926; --hgpo:#199e70; --spectral:#c98500;
  --extra1:#9a6ee0; --extra2:#e0679f; --extra3:#3fb3cc;
  --run:#199e70; --wait:#c99a3f; --bad:#e0685e; --done:#77766e;
    --crit:#d03b3b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
.meta{color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--axis)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 16px 10px;margin-bottom:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.panel h2{font-size:13px;margin:0 0 2px;font-weight:600}
.panel .sub{font-size:11px;color:var(--fg2);margin:0 0 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chartbox{position:relative}
svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12px}
.lg{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  padding:3px 0;font-variant-numeric:tabular-nums;transition:opacity .15s}
.lg.off{opacity:.32}
.sw{width:18px;height:3px;border-radius:2px;flex:none}
.lg .nm{font-weight:600;min-width:62px}
.lg .vl{color:var(--fg2)}
.lg .stale{color:var(--crit);font-size:11px;white-space:nowrap;font-weight:600}
@media (max-width:640px){
  .legend{gap:2px 0}
  .lg{width:100%}                       /* 一臂一行,拇指也点得中 */
  .lg .vl{font-size:11px}
  .wrap{padding:12px 10px}
}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);margin-top:6px}
input[type=range]{width:130px;accent-color:var(--grpo)}
.tasks{width:100%;border-collapse:collapse;font-size:12px}
.tasks td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
.tasks tr:first-child td{border-top:0}
.tasks .tl{white-space:normal;min-width:180px}
.tasks .tx{color:var(--fg2)}
.st{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
    color:#fff;white-space:nowrap}
.st.run{background:var(--run)} .st.wait{background:var(--wait)}
.st.bad{background:var(--bad)} .st.done{background:var(--done)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;
  line-height:1.75}
.msg code{background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font-size:12px;word-break:break-all}
.err{color:var(--crit)}
/* 悬浮读数:crosshair 在 svg 里画,数值面板用一个绝对定位的 HTML div ——
 * 文字排版比 SVG foreignObject 简单太多,且不会被 viewBox 缩放影响字号。 */
.tt{position:absolute;top:0;left:0;pointer-events:none;z-index:2;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font-size:11px;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.12);
  white-space:nowrap;opacity:0;transition:opacity .1s}
.tt.show{opacity:1}
.tt .hd{color:var(--fg2);font-variant-numeric:tabular-nums;margin-bottom:2px}
.tt .row{display:flex;align-items:center;gap:6px}
.tt .key{width:10px;height:2px;border-radius:1px;flex:none}
.tt .nm{color:var(--fg2);min-width:56px}
.tt .val{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ScienceWorld · 四臂 SR</h1>
    <span class="meta" id="stamp"></span>
    <span class="spacer"></span>
    <button id="refresh">刷新</button>
  </header>
  <div id="root"><div class="msg">载入中…</div></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------ 配置
 * gist 地址与密钥都从 URL 的 # 片段读,页面源码里一个都不写死。
 *   · fragment 永远不会随 HTTP 请求发出(GitHub Pages / gist CDN 都看不到);
 *   · 因此这个公开页面本身不泄露"数据在哪"和"怎么解开",
 *     陌生人打开只会看到下面那段"缺参数"提示。
 * 书签形如:  .../#g=<gist登录名>/<gist_id>&k=<base64url密钥>
 */
const FILE = "sw_sr.json";
const POLL_MS = 60000;
const ARMS = ["grpo", "gigpo", "hgpo", "spectral"];
const COLOR = {grpo:"--grpo", gigpo:"--gigpo", hgpo:"--hgpo", spectral:"--spectral"};
// payload 里 ARMS 之外的臂(变体实验)动态取色:名字只存在于密文里,
// 本文件(公开仓库)不硬编码任何新臂名。
const EXTRA_VARS = ["--extra1", "--extra2", "--extra3"];
let ARM_LIST = ARMS.slice();
function refreshArmList(data){
  const extras = Object.keys(data.arms || {})
    .filter(a => !ARMS.includes(a)).sort();
  ARM_LIST = [...ARMS, ...extras];
  extras.forEach((a, i) => { COLOR[a] = EXTRA_VARS[i % EXTRA_VARS.length]; });
}

const $ = s => document.querySelector(s);
const root = $("#root");

function hashParams(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  return {g: h.get("g"), k: h.get("k")};
}

/* ------------------------------------------------------------------ 解密 */
function unb64u(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(s + "=".repeat((4 - s.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function decrypt(envelope, keyB64){
  const key = await crypto.subtle.importKey(
    "raw", unb64u(keyB64), {name:"AES-GCM"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv: unb64u(envelope.iv)}, key, unb64u(envelope.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ------------------------------------------------------------------ 取数 */
async function load(){
  const {g, k} = hashParams();
  if (!g || !k) throw {kind:"setup"};
  // gist raw 带 max-age=300 的 CDN 缓存:cache-buster + no-store 一起用,
  // 但最坏情况仍可能落后一个 CDN 周期(推送本身是 120s 一次,可接受)。
  const url = `https://gist.githubusercontent.com/${g}/raw/${FILE}?t=${Date.now()}`;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw {kind:"http", msg:`gist 返回 ${r.status}`};
  const env = await r.json();
  if (!env.iv || !env.ct) throw {kind:"empty"};
  try { return await decrypt(env, k); }
  catch(e){ throw {kind:"key"}; }
}

/* ------------------------------------------------------------------ 画图 */
/* viewBox 的宽高比决定了手机上图有多高:900x300 在 390px 宽屏上只剩 130px,
 * 曲线全糊成一团。窄屏换一套更方的 viewBox,字号也因此相对变大。 */
function dims(){
  return innerWidth < 640
    ? {W:420, H:300, PAD:{t:10, r:10, b:26, l:34}}
    : {W:900, H:300, PAD:{t:12, r:14, b:30, l:44}};
}

function ema(vals, alpha){
  if (alpha <= 0) return vals.slice();
  const out = []; let acc = null;
  for (const v of vals){ acc = acc === null ? v : alpha*acc + (1-alpha)*v; out.push(acc); }
  return out;
}
function niceTicks(max, n){
  const raw = max/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  const out = []; for (let v=0; v<=max+1e-9; v+=step) out.push(v);
  return out;
}
function path(pts){
  return pts.length ? "M" + pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("L") : "";
}

// chart() 顺手把画图用的 px/py/xMax 等标度存进 chartMetas(跟 render() 里
// 面板出现的顺序一一对应),wireHover() 靠它把悬浮 crosshair 接到对的图上。
let chartMetas = [];

function chart(data, which, smooth, hidden){
  const {W, H, PAD} = dims();
  const series = ARM_LIST
    .map(a => ({a, d: (data.arms[a]||{})[which] || {s:[],v:[]}}))
    .filter(o => o.d.s.length && !hidden.has(o.a));

  if (!series.length){
    chartMetas.push(null);
    return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}"
      text-anchor="middle" fill="var(--dim)" font-size="13">暂无数据</text></svg></div>`;
  }

  const xMax = Math.max(...series.map(o => o.d.s[o.d.s.length-1]), 1);
  const yRaw = Math.max(...series.map(o => Math.max(...o.d.v)), 0.05);
  const yMax = Math.min(1, Math.ceil(yRaw*1.15*20)/20);

  const px = s => PAD.l + (s/xMax) * (W-PAD.l-PAD.r);
  const py = v => H-PAD.b - (v/yMax) * (H-PAD.t-PAD.b);

  let g = "";
  for (const t of niceTicks(yMax, 4)){
    const y = py(t);
    g += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}"
           stroke="var(--line)" stroke-width="1"/>
          <text x="${PAD.l-7}" y="${y+4}" text-anchor="end" fill="var(--dim)"
           font-size="10">${(t*100).toFixed(0)}%</text>`;
  }
  for (const t of niceTicks(xMax, 5)){
    if (t === 0) continue;
    const x = px(t);
    g += `<text x="${x}" y="${H-PAD.b+16}" text-anchor="middle" fill="var(--dim)"
           font-size="10">${t}</text>`;
  }
  g += `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${H-PAD.b}"
         stroke="var(--axis)" stroke-width="1"/>
        <line x1="${PAD.l}" y1="${H-PAD.b}" x2="${W-PAD.r}" y2="${H-PAD.b}"
         stroke="var(--axis)" stroke-width="1"/>`;

  const plotted = [];
  for (const {a, d} of series){
    const c = `var(${COLOR[a]})`;
    const pts = d.s.map((s,i)=>[px(s), py(d.v[i])]);
    let lastPt = pts[pts.length-1];
    // 训练曲线一步一个点、抖动很大 ⟹ 原始线压到 18% 当背景,EMA 线才是主角。
    // 验证曲线 10 步一个点、本来就平,不需要这套。
    if (which === "train" && smooth > 0){
      const sm = ema(d.v, smooth).map((v,i)=>[px(d.s[i]), py(v)]);
      g += `<path d="${path(pts)}" fill="none" stroke="${c}" stroke-width="1" opacity=".18"/>`;
      g += `<path d="${path(sm)}" fill="none" stroke="${c}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
      lastPt = sm[sm.length-1];
    } else {
      g += `<path d="${path(pts)}" fill="none" stroke="${c}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    // 端点标记:当前值的锚,2px 底色描边把它从线上"摘"出来,不用给每个点都画点。
    g += `<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="${c}"
           stroke="var(--panel)" stroke-width="2"/>`;
    plotted.push({a, c, s: d.s, v: d.v});
  }
  g += `<g class="hover-g"></g>`;
  chartMetas.push({W, H, PAD, xMax, px, py, series: plotted});
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>
    <div class="tt"></div></div>`;
}

function nearestIdx(arr, x){
  if (!arr.length) return -1;
  let lo = 0, hi = arr.length - 1;
  if (x <= arr[0]) return 0;
  if (x >= arr[hi]) return hi;
  while (hi - lo > 1){ const mid = (lo+hi) >> 1; arr[mid] < x ? lo = mid : hi = mid; }
  return (x - arr[lo] <= arr[hi] - x) ? lo : hi;
}

// crosshair + 每系列读数,鼠标/触摸都走这条路径。悬浮态只画在 hover-g 里,
// 不改静态渲染,所以跟 legend 的显隐切换互不干扰。
function wireHover(box, meta){
  if (!box || !meta) return;
  const svg = box.querySelector("svg"), tt = box.querySelector(".tt");
  const hoverG = svg.querySelector(".hover-g");
  const {W, H, PAD, xMax, px, py, series} = meta;

  function move(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    const r = svg.getBoundingClientRect();
    const ux = (t.clientX - r.left) / r.width * W;
    if (ux < PAD.l || ux > W - PAD.r){ leave(); return; }
    const sHover = (ux - PAD.l) / (W - PAD.l - PAD.r) * xMax;

    let dots = `<line x1="${ux.toFixed(1)}" y1="${PAD.t}" x2="${ux.toFixed(1)}" y2="${H-PAD.b}"
      stroke="var(--axis)" stroke-width="1" stroke-dasharray="3,3"/>`;
    let rows = "", step0 = null;
    for (const {a, c, s, v} of series){
      const idx = nearestIdx(s, sHover);
      if (idx < 0) continue;
      const step = s[idx], val = v[idx];
      if (step0 === null) step0 = step;
      dots += `<circle cx="${px(step).toFixed(1)}" cy="${py(val).toFixed(1)}" r="3.5"
        fill="${c}" stroke="var(--panel)" stroke-width="1.5"/>`;
      rows += `<div class="row"><span class="key" style="background:${c}"></span>
        <span class="nm">${a}</span><span class="val">${(val*100).toFixed(1)}%</span></div>`;
    }
    hoverG.innerHTML = dots;
    tt.innerHTML = `<div class="hd">step ${step0}</div>${rows}`;
    tt.classList.add("show");

    const boxR = box.getBoundingClientRect();
    const ttW = tt.offsetWidth, ttH = tt.offsetHeight;
    let left = t.clientX - boxR.left + 14, top = t.clientY - boxR.top - ttH - 10;
    if (left + ttW > boxR.width) left = t.clientX - boxR.left - ttW - 14;
    if (top < 0) top = t.clientY - boxR.top + 14;
    tt.style.left = `${Math.max(0,left)}px`;
    tt.style.top = `${Math.max(0,top)}px`;
  }
  function leave(){
    tt.classList.remove("show");
    hoverG.innerHTML = "";
  }
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", leave);
  svg.addEventListener("touchmove", ev => { move(ev); ev.preventDefault(); }, {passive:false});
  svg.addEventListener("touchend", leave);
}

/* ------------------------------------------------------------------ 渲染 */
const hidden = new Set();
let smooth = 0.85, latest = null;

function dur(sec){
  if (sec < 90) return `${Math.round(sec)} 秒`;
  if (sec < 5400) return `${Math.round(sec/60)} 分钟`;
  if (sec < 172800) return `${(sec/3600).toFixed(1)} 小时`;
  return `${(sec/86400).toFixed(1)} 天`;
}
function ago(sec){ return (!sec || sec < 0) ? "—" : dur(sec) + "前"; }
function fmtAbs(ts){
  const d = new Date(ts*1000), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// pace10_s/eta 是 publish_sr.py 用 val 每 10 步的 wall_time 差算出来的
// (中位数,躲开断点续跑的排队等待),eta 是 unix 时间戳。
function paceEta(arm, curStep){
  const total = arm.epochs_total;
  if (total && curStep >= total) return {pace:"—", eta:"已完成"};
  const pace = arm.pace10_s ? dur(arm.pace10_s) : "—";
  const eta = arm.eta ? `${dur(arm.eta - Date.now()/1000)}后 · ${fmtAbs(arm.eta)}` : "—";
  return {pace, eta};
}

function legend(data){
  const now = Date.now()/1000;
  return `<div class="legend">` + ARM_LIST.map(a=>{
    const arm = data.arms[a] || {};
    const tr = arm.train || {s:[],v:[]};
    const va = arm.val   || {s:[],v:[]};
    const sc = arm.score || {s:[],v:[]};
    const last = tr.v.length ? ema(tr.v, smooth).slice(-1)[0] : null;
    const vlast = va.v.length ? va.v[va.v.length-1] : null;
    const slast = sc.v.length ? sc.v[sc.v.length-1] : null;
    const step = tr.s.length ? tr.s[tr.s.length-1] : 0;
    // 阈值 90 分钟,不是凭感觉:val 评测**期间完全不写标量**,而实测评测耗时
    // 中位 37 分、最长 46 分(2026-08-18 量的四条 run 的 timing_s/testing)。
    // 定 30 分钟的话,每 10 步做一次 val 就误报一次"臂停了" —— 狼来了的告警
    // 比没有告警更糟。90 分钟 ≈ 2× 实测最长评测,既躲开评测窗口又不会拖太久。
    const idle = arm.mtime ? now - arm.mtime : null;
    const stale = idle !== null && idle > 5400;
    const {pace, eta} = paceEta(arm, step);
    return `<div class="lg ${hidden.has(a)?"off":""}" data-arm="${a}">
      <span class="sw" style="background:var(${COLOR[a]})"></span>
      <span class="nm">${a}</span>
      <span class="vl">step ${step}${arm.epochs_total?"/"+arm.epochs_total:""}
        · train ${last===null?"—":(last*100).toFixed(1)+"%"}
        · val ${vlast===null?"—":(vlast*100).toFixed(1)+"%"}
        · score ${slast===null?"—":(slast*100).toFixed(1)+"%"}
        · 10epoch耗时 ${pace} · 预计完成 ${eta}</span>
      ${stale?`<span class="stale">${dur(idle)} 无写入</span>`:""}
    </div>`;
  }).join("") + `</div>`;
}

/* ------------------------------------------------------------- 任务进度 */
// 纯数据驱动:标签/状态全部来自解密后的 payload,本文件不含任何任务内容。
const STATE_ZH = {RUNNING:"运行中", PENDING:"排队", COMPLETED:"已完成",
                  FAILED:"失败", CANCELLED:"已取消", TIMEOUT:"超时",
                  UNKNOWN:"未知"};
function tasksPanel(data){
  const t = data.tasks;
  if (!t || !t.jobs || !t.jobs.length) return "";
  const rows = t.jobs.map(j=>{
    const s = (j.state || "UNKNOWN").split(" ")[0];
    const cls = s === "RUNNING" ? "run" : s === "PENDING" ? "wait"
              : s === "COMPLETED" ? "done" : "bad";
    let extra = "";
    if (s === "PENDING"){
      extra = j.reason && j.reason !== "None" ? `${j.reason}` : "";
      if (j.sched_start && j.sched_start !== "N/A")
        extra += ` · 预计 ${j.sched_start.slice(5, 16).replace("T", " ")}`;
    } else if (j.elapsed && j.elapsed !== "00:00:00"){
      extra = `已跑 ${j.elapsed}`;
    }
    if (j.note) extra += (extra ? " · " : "") + j.note;
    return `<tr><td class="tl">${j.label || j.id}</td>
      <td><span class="st ${cls}">${STATE_ZH[s] || s}</span></td>
      <td class="tx">${extra}</td></tr>`;
  }).join("");
  return `<div class="panel"><h2>任务进度</h2>
    <p class="sub">SLURM 实时状态 · 采集于 ${ago(Date.now()/1000 - t.updated)}</p>
    <table class="tasks"><tbody>${rows}</tbody></table></div>`;
}

function render(data){
  latest = data;
  refreshArmList(data);
  $("#stamp").textContent = `数据更新于 ${ago(Date.now()/1000 - data.updated)}`;
  chartMetas = [];             // chart() 按面板出现顺序往里 push,下面按同一顺序接 hover
  root.innerHTML = `
    ${tasksPanel(data)}
    <div class="panel">
      <h2>验证 SR</h2>
      <p class="sub">val/success_rate · 每 10 步一次 · 这条才是可写进论文的口径</p>
      ${chart(data, "val", 0, hidden)}
      ${legend(data)}
    </div>
    <div class="panel">
      <h2>验证 Score</h2>
      <p class="sub">val/score · 同一批评测的 partial-credit 分数 ·
        SR 还卡在 0 的时候它已经能分出高下</p>
      ${chart(data, "score", 0, hidden)}
    </div>
    <div class="panel">
      <h2>训练 SR</h2>
      <p class="sub">episode/success_rate · 每步 · 细线原始,粗线 EMA</p>
      ${chart(data, "train", smooth, hidden)}
      <div class="ctl"><span>平滑</span>
        <input type="range" id="sm" min="0" max="0.98" step="0.02" value="${smooth}">
        <span id="smv">${smooth.toFixed(2)}</span></div>
    </div>`;

  root.querySelectorAll(".chartbox").forEach((box, i) => wireHover(box, chartMetas[i]));

  root.querySelectorAll(".lg").forEach(el=>{
    el.onclick = () => {
      const a = el.dataset.arm;
      hidden.has(a) ? hidden.delete(a) : hidden.add(a);
      render(latest);
    };
  });
  const sm = $("#sm");
  if (sm) sm.oninput = e => { smooth = +e.target.value; render(latest); };
}

function showError(e){
  $("#stamp").textContent = "";
  if (e.kind === "setup"){
    root.innerHTML = `<div class="msg">
      <b>缺参数。</b>这个页面本身不含任何数据来源 —— gist 地址和解密密钥都在书签
      URL 的 <code>#</code> 片段里,而片段不会发给任何服务器。<br><br>
      正确的地址形如:<br>
      <code>${location.origin}${location.pathname}#g=你的登录名/gist_id&amp;k=密钥</code>
      <br><br>这两个值由集群上的 <code>publish_sr.py --create-gist</code> 打印。</div>`;
  } else if (e.kind === "key"){
    root.innerHTML = `<div class="msg err"><b>解不开。</b>密钥(<code>#k=</code>)与
      推上去的数据对不上 —— 多半是换过密钥后没更新书签,或 URL 被截断过。</div>`;
  } else if (e.kind === "empty"){
    root.innerHTML = `<div class="msg">gist 里还没有密文。集群上先跑一次
      <code>publish_sr.py --once</code>。</div>`;
  } else {
    root.innerHTML = `<div class="msg err"><b>取不到数据。</b>${e.msg || e}</div>`;
  }
}

async function tick(){
  try { render(await load()); }
  catch(e){ if (latest && (e.kind === "http")) return; showError(e); }
}
let rz;
addEventListener("resize", () => {          // 转屏要换 viewBox 档位,否则图停在旧比例
  clearTimeout(rz);
  rz = setTimeout(() => { if (latest) render(latest); }, 200);
});
$("#refresh").onclick = tick;
addEventListener("hashchange", tick);
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>训练看板</title>
<style>
/* 亮色是基色;暗色只在 prefers-color-scheme 里覆盖同一批 token,数值
 * 全部来自 dataviz 技能的已校验默认色板(四类别色取 slot 1-4:蓝/橙/青/黄,
 * 相邻 CVD ΔE ≥ 8、常人 ΔE ≥ 15 都过线 —— 旧的手选配色在暗色下
 * gigpo/hgpo 两色 ΔE 只有 0.85,色弱基本分不出来)。 */
:root{
  --bg:#f9f9f7; --panel:#fcfcfb; --line:#e1e0d9; --axis:#c3c2b7;
  --fg:#0b0b0b; --fg2:#52514e; --dim:#898781;
  --grpo:#2a78d6; --gigpo:#eb6834; --hgpo:#1baf7a; --spectral:#eda100;
  --extra1:#8a5cd6; --extra2:#d6539a; --extra3:#2aa8c4;
  --run:#1baf7a; --wait:#b9862c; --bad:#d1483e; --done:#8a8981;
  --crit:#d03b3b;                 /* 状态色,固定,不跟着类别色板走 */
  /* 对垒面板的配色家族(蓝/橙/青/灰)。灰是刻意的第 4 家族:紫在 protan
   * 模拟下与蓝不可分(实测 ΔE 1-3),灰靠零彩度与谁都拉得开。
   * 深色下青/灰对的 CVD ΔE 落在 6-8 警戒带 ⟹ 同家族一律再叠线型区分。 */
  --pf0:#2a78d6; --pf1:#eb6834; --pf2:#1baf7a; --pf3:#5f5e59;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0d0d; --panel:#1a1a19; --line:#2c2c2a; --axis:#383835;
    --fg:#ffffff; --fg2:#c3c2b7; --dim:#898781;
    --grpo:#3987e5; --gigpo:#d95926; --hgpo:#199e70; --spectral:#c98500;
  --extra1:#9a6ee0; --extra2:#e0679f; --extra3:#3fb3cc;
  --run:#199e70; --wait:#c99a3f; --bad:#e0685e; --done:#77766e;
    --crit:#d03b3b;
    --pf0:#3987e5; --pf1:#d95926; --pf2:#199e70; --pf3:#a3a29b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
.meta{color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--axis)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 16px 10px;margin-bottom:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.panel h2{font-size:13px;margin:0 0 2px;font-weight:600}
.panel .sub{font-size:11px;color:var(--fg2);margin:0 0 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chartbox{position:relative}
svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12px}
.lg{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  padding:3px 0;font-variant-numeric:tabular-nums;transition:opacity .15s}
.lg.off{opacity:.32}
.sw{width:18px;height:3px;border-radius:2px;flex:none}
.lg .nm{font-weight:600;min-width:62px}
.lg .vl{color:var(--fg2)}
.lg .stale{color:var(--crit);font-size:11px;white-space:nowrap;font-weight:600}
@media (max-width:640px){
  .legend{gap:2px 0}
  .lg{width:100%}                       /* 一臂一行,拇指也点得中 */
  .lg .vl{font-size:11px}
  .wrap{padding:12px 10px}
}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);margin-top:6px}
/* 任务组的分隔:两套实验的量级不可比,视觉上也必须一眼看出"这是另一摊" */
.ghead{display:flex;align-items:baseline;gap:9px;margin:26px 2px 10px;
  padding-left:9px;border-left:3px solid var(--axis)}
.ghead:first-child{margin-top:4px}
.ghead .gt{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em}
.ghead .gs{font-size:11px;color:var(--dim)}
input[type=range]{width:130px;accent-color:var(--grpo)}
.tasks{width:100%;border-collapse:collapse;font-size:12px}
.tasks td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
.tasks tr:first-child td{border-top:0}
.tasks .tl{white-space:normal;min-width:180px}
.tasks .tx{color:var(--fg2);line-height:1.7}
.tasks .tx b{color:var(--fg);font-weight:600}
.soft{opacity:.62}
.qcell{white-space:nowrap;font-size:12px}
.qnum{font-variant-numeric:tabular-nums}
.qbar{display:inline-block;width:78px;height:7px;border-radius:99px;
      background:var(--line);overflow:hidden;vertical-align:middle;margin:0 6px}
.qbar i{display:block;height:100%;border-radius:99px}
/* ⚠️ 这个媒体查询必须放在 .qcell/.qbar 的基础规则**之后**。
 * 同特异度下 CSS 按源码顺序取胜 —— 放在前面的话 width:78px 会把
 * width:auto 覆盖掉,窄屏上进度条照样顶出边框(改第一版就踩了这个)。 */
@media (max-width:640px){
  /* 三列各自 nowrap 时,「数值 + 进度条 + 百分比」在 390px 宽屏上塞不下,
   * 进度条会溢出面板。窄屏改成表格拆块:一行一格,条子自适应剩余宽度。 */
  .tasks, .tasks tbody, .tasks tr, .tasks td{display:block;width:auto}
  .tasks tr{border-top:1px solid var(--line);padding:7px 0}
  .tasks tr:first-child{border-top:0}
  .tasks td{border-top:0;padding:2px 0}
  .tasks .tl{min-width:0}
  .qcell{white-space:normal;display:flex;align-items:center;gap:6px}
  .qnum{flex:0 0 auto}
  .qbar{flex:1 1 auto;width:auto;min-width:40px;margin:0}
}
/* 预计完成:底纹深浅 = 推算可靠性。best 最实,weak 虚线表示"别当真" */
.fin{display:inline-block;padding:1px 7px;border-radius:6px;cursor:help;
     border:1px solid transparent}
.fin b{font-weight:600}
.fin.best{background:color-mix(in srgb, var(--run) 16%, transparent);
          border-color:color-mix(in srgb, var(--run) 40%, transparent)}
.fin.ok  {background:color-mix(in srgb, var(--grpo) 13%, transparent);
          border-color:color-mix(in srgb, var(--grpo) 32%, transparent)}
.fin.weak{border-style:dashed;
          border-color:color-mix(in srgb, var(--wait) 55%, transparent);opacity:.8}
.st{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
    color:#fff;white-space:nowrap}
.st.run{background:var(--run)} .st.wait{background:var(--wait)}
.st.bad{background:var(--bad)} .st.done{background:var(--done)}
/* 对垒面板专用:数据表要能横向滚,绝不能进 .tasks 那套窄屏拆块逻辑 */
.tblw{overflow-x:auto;margin-top:6px}
.ptbl{border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.ptbl th,.ptbl td{padding:4px 9px;text-align:right;border-top:1px solid var(--line)}
.ptbl tr:first-child th{border-top:0}
.ptbl th{color:var(--dim);font-weight:500}
.ptbl th:first-child,.ptbl td:first-child{text-align:left}
.ptbl .gf{color:var(--dim);font-size:10px}
details.bld{margin-top:8px}
details.bld summary{cursor:pointer;font-size:12px;color:var(--fg2);padding:4px 0;user-select:none}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;
  line-height:1.75}
.msg code{background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font-size:12px;word-break:break-all}
.err{color:var(--crit)}
/* 悬浮读数:crosshair 在 svg 里画,数值面板用一个绝对定位的 HTML div ——
 * 文字排版比 SVG foreignObject 简单太多,且不会被 viewBox 缩放影响字号。 */
.tt{position:absolute;top:0;left:0;pointer-events:none;z-index:2;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font-size:11px;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.12);
  white-space:nowrap;opacity:0;transition:opacity .1s}
.tt.show{opacity:1}
.tt .hd{color:var(--fg2);font-variant-numeric:tabular-nums;margin-bottom:2px}
.tt .row{display:flex;align-items:center;gap:6px}
.tt .key{width:10px;height:2px;border-radius:1px;flex:none}
.tt .nm{color:var(--fg2);min-width:56px}
.tt .val{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:10px}
/* 折叠钮(每块面板/每个大类)与 ✕ 隐藏钮(终态任务行)。两者的状态先落
 * localStorage,再加密同步到 gist(见下面"界面状态"一节)—— 明文永远只在
 * 本机与内存里,gist 上是密文,公开仓库这份源码里一个作业号都没有。 */
.phead{display:flex;align-items:baseline;gap:7px}
.phead h2{margin:0}
.cbtn{background:none;border:0;padding:0 2px;color:var(--dim);cursor:pointer;
  font-size:11px;line-height:inherit;width:18px;flex:none;text-align:left}
.cbtn:hover{color:var(--fg);border:0}
.ghead .cbtn{font-size:12px}
.panel.closed{padding-bottom:12px}
.tsec{display:flex;align-items:baseline;gap:7px;font-size:12px;font-weight:600;
  color:var(--fg2);margin:12px 0 4px}
.tsec .soft{font-weight:400}
.xbtn{background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;
  padding:2px 6px;line-height:1}
.xbtn:hover{color:var(--crit);border:0}
.tasks .xc{width:26px;text-align:right}
.sub a{color:var(--fg2)}
/* 同步指示器:平时是一行灰字,点一下强制立刻同步一次 */
.sync{background:none;border:0;padding:0 0 0 10px;color:var(--dim);cursor:pointer;
  font-size:12px;font-variant-numeric:tabular-nums}
.sync:hover{border:0;color:var(--fg2)}
.sync.bad{color:var(--crit)}
.sync.bad:hover{color:var(--crit)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RL 训练看板</h1>
    <span class="meta" id="stamp"></span>
    <button class="sync" id="sync"></button>
    <span class="spacer"></span>
    <button id="refresh">刷新</button>
  </header>
  <div id="root"><div class="msg">载入中…</div></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------ 配置
 * gist 地址与密钥都从 URL 的 # 片段读,页面源码里一个都不写死。
 *   · fragment 永远不会随 HTTP 请求发出(GitHub Pages / gist CDN 都看不到);
 *   · 因此这个公开页面本身不泄露"数据在哪"和"怎么解开",
 *     陌生人打开只会看到下面那段"缺参数"提示。
 * 书签形如:  .../#g=<gist登录名>/<gist_id>&k=<密钥>[&t=<gist写入token>]
 *   · &t= 是可选的第三段:给了就能把界面状态(折叠/隐藏/平滑)写回 gist,
 *     从而在电脑端和手机端之间同步;不给则只收不发(仍然会读到另一端的
 *     改动,只是自己这台的改动留在本机)。
 */
const FILE = "sw_sr.json";
const BL_FILE = "baselines.json";     // 静态对垒数据,同一 gist 的第二个文件,可缺
const UI_FILE = "ui_state.json";      // 界面状态密文,同一 gist 的第三个文件,可缺
const POLL_MS = 60000;
const BASE = ["grpo", "gigpo", "hgpo", "spectral"];
const BASE_VARS = {grpo:"--grpo", gigpo:"--gigpo", hgpo:"--hgpo", spectral:"--spectral"};
// 基准四臂之外的臂(变体实验)动态取色:名字只存在于密文里,
// 本文件(公开仓库)不硬编码任何新臂名。
const EXTRA_VARS = ["--extra1", "--extra2", "--extra3"];
const COLOR = {};                     // payload 的臂 key -> CSS 变量

/* payload 按任务分组(data.groups + 每臂的 group/disp)。2026-08-22 加,
 * 起因是 ALFWorld 8B 的 SR 到了 0.97,和 ScienceWorld 3B 的 0.12~0.58
 * 画在同一张图里:y 轴被顶到 100%,SW 五条全挤进下半区,图等于白画。
 * ⟹ 一组一整套面板,x/y 标度、图例、取色池全部各自独立。
 * 老 payload(没有 groups 字段)退回单组,渲染结果与改版前一致。 */
let GROUPS = [];
function refreshGroups(data){
  const arms = data.arms || {};
  const disp = a => (arms[a] || {}).disp || a;
  const defs = (data.groups && data.groups.length) ? data.groups
                                                   : [{key:"", label:""}];
  const taken = new Set();
  GROUPS = defs.map(g => {
    const keys = Object.keys(arms).filter(a => (arms[a].group || "") === g.key);
    keys.forEach(a => taken.add(a));
    // 组内先基准四臂后变体。变体取色池**每组独立** —— 全局排号的话
    // 组一多就会 i%3 撞色(两个任务各四臂时实测撞两对)。
    const base = BASE.map(b => keys.find(a => disp(a) === b)).filter(Boolean);
    const extra = keys.filter(a => !base.includes(a)).sort();
    base.forEach(a => { COLOR[a] = BASE_VARS[disp(a)]; });
    extra.forEach((a, i) => { COLOR[a] = EXTRA_VARS[i % EXTRA_VARS.length]; });
    return {key:g.key, label:g.label, arms:[...base, ...extra]};
  }).filter(g => g.arms.length);
  // 兜底:payload 里出现了不属于任何已知组的臂(推送端加了组却没下发 label)
  // 也要画出来 —— 静默丢一条曲线比多画一块面板糟得多。
  const orphan = Object.keys(arms).filter(a => !taken.has(a)).sort();
  if (orphan.length){
    orphan.forEach((a, i) => { COLOR[a] = EXTRA_VARS[i % EXTRA_VARS.length]; });
    GROUPS.push({key:"_", label:"未分组", arms:orphan});
  }
}

const $ = s => document.querySelector(s);
const root = $("#root");

/* --------------------------------------------- 界面状态(本地 + 跨设备同步)
 * 折叠了哪些面板、✕ 掉了哪些任务、隐藏了哪些图例、平滑系数 —— 先落
 * localStorage(离线也立刻生效、关页重开保持),再加密推回同一个 gist 的
 * 第三个文件。0830 加,起因是同一批终态任务要在电脑端和手机端各 ✕ 一遍。
 *
 * 合并规则是 LWW-map:每个条目 {v:值, t:写入时刻ms}。
 *   · 集合类拍平成 "命名空间|成员" 一个条目;取消一项写 v:0 的**墓碑**,
 *     而不是删条目 —— 直接删的话,另一端那份旧的 v:1 下次合并就把它复活;
 *   · 两端改不同条目互不影响,改同一条目则时间戳晚的赢;
 *   · 于是 gist raw 的 CDN 缓存(max-age=300)读到旧值也无害:旧时间戳打不过
 *     本地的新时间戳,不会把刚刚做过的操作回滚成上一轮的样子。
 * 推上去的是 AES-GCM 密文(和主 payload 共用 #k= 那把密钥),gist 上依旧
 * 看不到一个明文的作业号或面板名。读写都包 try(隐私模式/禁存储照常渲染)。 */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k);
                  return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const TOMB_MS = 180 * 86400e3;      // 墓碑保留期,见 pruneState()
let ST = store.get("sr.state", null);
if (!ST || !ST.items) ST = migrate();

/* 0829 那版(每个开关一个 localStorage 键)的状态搬进 LWW-map,每台设备搬
 * 一次。时间戳给 1 而不是 now:另一端任何一次真实操作都该赢过"这台机器
 * 碰巧后打开页面"。两端都还是迁移值(t 都是 1)时按 mergeState 的并集规则
 * 收,即"任一端隐藏过的就算隐藏" —— 比随机一端全胜合理。 */
function migrate(){
  const items = {};
  const seed = (ns, arr) => (arr || []).forEach(m => { items[ns + "|" + m] = {v:1, t:1}; });
  seed("d", store.get("sr.dismissed", []));
  seed("c", store.get("sr.collapsed", []));
  seed("h", store.get("sr.hiddenArms", []));
  seed("b", store.get("sr.blHidden", []));
  const sm = store.get("sr.smooth", null);
  if (sm !== null) items["smooth"] = {v: sm, t: 1};
  return {items};
}

// 命名空间 -> 内存里的 Set(渲染代码照旧直接读这四个 Set 和 smooth)
const dismissed = new Set();      // ✕ 掉的作业号
const collapsed = new Set();      // 折叠的面板键
const hidden    = new Set();      // 隐藏的 SR 曲线(臂 key)
const blHidden  = new Set();      // 隐藏的对垒曲线("面板序号:系列名")
const SETS = {d: dismissed, c: collapsed, h: hidden, b: blHidden};
let smooth = 0.85;
function applyState(){
  for (const set of Object.values(SETS)) set.clear();
  smooth = 0.85;
  for (const [key, e] of Object.entries(ST.items)){
    if (!e || !e.v) continue;                       // 墓碑
    const i = key.indexOf("|");                     // 成员名里可能有 "|",只切第一个
    if (i < 0){ if (key === "smooth") smooth = e.v; continue; }
    const set = SETS[key.slice(0, i)];
    if (set) set.add(key.slice(i + 1));
  }
}
applyState();
const isClosed = k => collapsed.has(k);

/* 所有界面操作走这三个:改条目 -> commit() 落本地并排一次防抖推送。
 * 推送失败不影响本地(离线照常用,联网后下一次操作或轮询会把它带上去)。 */
function setItem(key, v){ ST.items[key] = {v, t: Date.now()}; }
function flag(ns, member, on){ setItem(ns + "|" + member, on ? 1 : 0); }
function commit(){ applyState(); store.set("sr.state", ST); schedulePush(); }

/* 远端那份并进本地。返回 true = 有条目变了(调用方要重渲染)。 */
function mergeState(remote){
  if (!remote || !remote.items) return false;
  let changed = false, ahead = false;
  for (const [key, r] of Object.entries(remote.items)){
    if (!r || typeof r.t !== "number") continue;
    const l = ST.items[key];
    // 时间戳不同 -> 晚的赢。一样时分两种:
    //   · 都是迁移值(t=1)-> 取"开着"的,即两端老状态的并集;
    //   · 都是真实操作、恰好同一毫秒 -> 按值定死一个方向(取消赢),两端各自
    //     算出同一个赢家。若改成"保留本地",两端会各留各的,永远不收敛。
    let win;
    if (!l) win = true;
    else if (r.t !== l.t) win = r.t > l.t;
    else if (l.t === 1) win = !!r.v && !l.v;
    else win = String(r.v) < String(l.v);
    if (win){
      if (l && l.v !== r.v) changed = true;
      else if (!l && r.v) changed = true;
      ST.items[key] = {v: r.v, t: r.t};
    }
  }
  // 本地有而远端没有(或本地更新)的条目要主动推上去,否则两端各改各的之后
  // 谁也不会再推,对方永远收不到 —— 只靠"操作时推"是收敛不了的。
  for (const [key, l] of Object.entries(ST.items)){
    const r = remote.items[key];
    if (!r || l.t > r.t || l.v !== r.v){ ahead = true; break; }
  }
  pruneState();
  store.set("sr.state", ST);
  applyState();
  // CDN 给的可能是自己刚推上去那一版之前的快照,这时 ahead 恒为真;拿上次
  // 推成功的快照比一比,一样就别推 —— 否则缓存没过期的这几分钟里每轮都白推。
  if (ahead && JSON.stringify(ST) !== lastPushed) schedulePush();
  return changed;
}
/* 墓碑不清的话,一年下来光作业号就好几千条。半年以上的墓碑丢掉 ——
 * 代价写清楚:某台设备超过半年没打开过,它那份旧的 v:1 会复活一次。 */
function pruneState(){
  const cut = Date.now() - TOMB_MS;
  for (const [key, e] of Object.entries(ST.items))
    if (e && !e.v && e.t > 1 && e.t < cut) delete ST.items[key];
}
function cbtn(k){
  return `<button class="cbtn" data-c="${k}" title="折叠/展开">${isClosed(k) ? "▸" : "▾"}</button>`;
}
/* 面板外壳:标题旁带折叠钮;折叠时**不渲染**内容体 —— 不是 display:none。
 * 这一点是承重的:chart()/blChart() 按渲染顺序往 chartMetas/blMetas 里
 * push,wireHover 再按同一顺序接回去,跳过渲染两边才对得上号。 */
function panelBox(key, title, sub, bodyFn){
  const closed = isClosed(key);
  return `<div class="panel${closed ? " closed" : ""}">`
    + `<div class="phead">${cbtn(key)}<h2>${title}</h2></div>`
    + (closed ? "" : `<p class="sub">${sub}</p>` + bodyFn())
    + `</div>`;
}

function hashParams(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  return {g: h.get("g"), k: h.get("k"), t: h.get("t")};
}

/* ------------------------------------------------------------------ 解密 */
function unb64u(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(s + "=".repeat((4 - s.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function b64u(bytes){
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function decrypt(envelope, keyB64){
  const key = await crypto.subtle.importKey(
    "raw", unb64u(keyB64), {name:"AES-GCM"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv: unb64u(envelope.iv)}, key, unb64u(envelope.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* 回写方向的加密。信封字段与推送端 publish_sr.py 的 encrypt() 一字不差,
 * 两边写的是同一把密钥下同一种格式,谁也不用认对方是"特殊来源"。 */
async function encrypt(obj, keyB64){
  const key = await crypto.subtle.importKey(
    "raw", unb64u(keyB64), {name:"AES-GCM"}, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key,
    new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, alg:"A256GCM", iv:b64u(iv), ct:b64u(new Uint8Array(ct))};
}

/* ------------------------------------------------------------------ 取数 */
async function load(){
  const {g, k} = hashParams();
  if (!g || !k) throw {kind:"setup"};
  // gist raw 带 max-age=300 的 CDN 缓存:cache-buster + no-store 一起用,
  // 但最坏情况仍可能落后一个 CDN 周期(推送本身是 120s 一次,可接受)。
  const url = f => `https://gist.githubusercontent.com/${g}/raw/${f}?t=${Date.now()}`;
  const r = await fetch(url(FILE), {cache:"no-store"});
  if (!r.ok) throw {kind:"http", msg:`gist 返回 ${r.status}`};
  const env = await r.json();
  if (!env.iv || !env.ct) throw {kind:"empty"};
  let data;
  try { data = await decrypt(env, k); }
  catch(e){ throw {kind:"key"}; }
  // 对垒数据是可选的:没推过(404)或坏了都只是不渲染那一节,绝不拖垮主看板
  try {
    const rb = await fetch(url(BL_FILE), {cache:"no-store"});
    if (rb.ok){
      const eb = await rb.json();
      if (eb.iv && eb.ct) data._bl = await decrypt(eb, k);
    }
  } catch(e){}
  // 界面状态同样是可选的:没推过(404)、解不开、格式怪 —— 一律退回本机那份,
  // 绝不因为同步出问题而看不到数据。读走 raw(不需要 token),所以没配 &t=
  // 的设备也能收到另一端的折叠/隐藏。
  try {
    const ru = await fetch(url(UI_FILE), {cache:"no-store"});
    if (ru.ok){
      const eu = await ru.json();
      if (eu.iv && eu.ct) mergeState(await decrypt(eu, k));
    }
  } catch(e){}
  return data;
}

/* ------------------------------------------------------------ 状态回写
 * 写要 token:gist 的 PATCH 走 api.github.com,而 fragment 里的 &t= 和 &k=
 * 一样不会随请求发给 Pages。PATCH 的 files 只写 UI_FILE 这一个文件名 ——
 * 和推送端只写 sw_sr.json 是同一个约定,两边互不覆盖。 */
let pushT = null, pushing = false, pushMore = false, lastPushed = "";
function schedulePush(){
  clearTimeout(pushT);
  // 防抖 1.2s:平滑滑块拖一次能触发几十个 oninput,不能一个一个 PATCH
  pushT = setTimeout(pushState, 1200);
}
async function pushState(){
  const {g, k, t} = hashParams();
  if (!g || !k) return;
  if (!t){ setSync("ro"); return; }
  if (pushing){ pushMore = true; return; }
  pushing = true; setSync("busy");
  try {
    const snap = JSON.stringify(ST);
    const env = await encrypt(ST, k);
    const r = await fetch(`https://api.github.com/gists/${g.split("/").pop()}`, {
      method: "PATCH", cache: "no-store",
      headers: {"Authorization": `Bearer ${t}`,
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                "Content-Type": "application/json"},
      body: JSON.stringify({files: {[UI_FILE]: {content: JSON.stringify(env)}}})
    });
    if (!r.ok) throw new Error(`gist 写回 ${r.status}`);
    lastPushed = snap;
    setSync("ok");
  } catch(e){
    setSync("bad", e.message || String(e));
  }
  pushing = false;
  if (pushMore){ pushMore = false; schedulePush(); }
}
/* 头部那行小灰字。状态说人话,失败要看得见 —— 静默失败的同步比没有同步糟:
 * 你会以为另一端已经跟上了。 */
function setSync(kind, msg){
  const el = $("#sync");
  if (!el) return;
  const hhmm = () => { const d = new Date(), p = n => String(n).padStart(2,"0");
                       return `${p(d.getHours())}:${p(d.getMinutes())}`; };
  const T = {
    ro:   ["只收不发", "书签里没有 &t=<token>:这台设备会收到另一端的改动,但自己的改动只留在本机。集群上跑 publish_sr.py --bookmark 取带 token 的书签。"],
    idle: ["同步就绪", "折叠/隐藏/✕ 会自动同步到你的另一台设备"],
    busy: ["同步中…", ""],
    ok:   [`已同步 ${hhmm()}`, "折叠/隐藏/平滑已写回 gist,另一端下次刷新就跟上"],
    bad:  ["同步失败", msg || ""]
  }[kind] || ["", ""];
  el.textContent = T[0];
  el.title = T[1];
  el.classList.toggle("bad", kind === "bad");
}

/* ------------------------------------------------------------------ 画图 */
/* viewBox 的宽高比决定了手机上图有多高:900x300 在 390px 宽屏上只剩 130px,
 * 曲线全糊成一团。窄屏换一套更方的 viewBox,字号也因此相对变大。 */
function dims(){
  return innerWidth < 640
    ? {W:420, H:300, PAD:{t:10, r:10, b:26, l:34}}
    : {W:900, H:300, PAD:{t:12, r:14, b:30, l:44}};
}

function ema(vals, alpha){
  if (alpha <= 0) return vals.slice();
  const out = []; let acc = null;
  for (const v of vals){ acc = acc === null ? v : alpha*acc + (1-alpha)*v; out.push(acc); }
  return out;
}
function niceTicks(max, n){
  const raw = max/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  const out = []; for (let v=0; v<=max+1e-9; v+=step) out.push(v);
  return out;
}
function path(pts){
  return pts.length ? "M" + pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("L") : "";
}

// chart() 顺手把画图用的 px/py/xMax 等标度存进 chartMetas(跟 render() 里
// 面板出现的顺序一一对应),wireHover() 靠它把悬浮 crosshair 接到对的图上。
let chartMetas = [];

function chart(data, armKeys, which, smooth, hidden){
  const {W, H, PAD} = dims();
  const series = armKeys
    .map(a => ({a, d: (data.arms[a]||{})[which] || {s:[],v:[]}}))
    .filter(o => o.d.s.length && !hidden.has(o.a));

  if (!series.length){
    chartMetas.push(null);
    return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}"
      text-anchor="middle" fill="var(--dim)" font-size="13">暂无数据</text></svg></div>`;
  }

  const xMax = Math.max(...series.map(o => o.d.s[o.d.s.length-1]), 1);
  const yRaw = Math.max(...series.map(o => Math.max(...o.d.v)), 0.05);
  const yMax = Math.min(1, Math.ceil(yRaw*1.15*20)/20);

  const px = s => PAD.l + (s/xMax) * (W-PAD.l-PAD.r);
  const py = v => H-PAD.b - (v/yMax) * (H-PAD.t-PAD.b);

  let g = "";
  for (const t of niceTicks(yMax, 4)){
    const y = py(t);
    g += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}"
           stroke="var(--line)" stroke-width="1"/>
          <text x="${PAD.l-7}" y="${y+4}" text-anchor="end" fill="var(--dim)"
           font-size="10">${(t*100).toFixed(0)}%</text>`;
  }
  for (const t of niceTicks(xMax, 5)){
    if (t === 0) continue;
    const x = px(t);
    g += `<text x="${x}" y="${H-PAD.b+16}" text-anchor="middle" fill="var(--dim)"
           font-size="10">${t}</text>`;
  }
  g += `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${H-PAD.b}"
         stroke="var(--axis)" stroke-width="1"/>
        <line x1="${PAD.l}" y1="${H-PAD.b}" x2="${W-PAD.r}" y2="${H-PAD.b}"
         stroke="var(--axis)" stroke-width="1"/>`;

  const plotted = [];
  for (const {a, d} of series){
    const c = `var(${COLOR[a]})`;
    const pts = d.s.map((s,i)=>[px(s), py(d.v[i])]);
    let lastPt = pts[pts.length-1];
    // 训练曲线一步一个点、抖动很大 ⟹ 原始线压到 18% 当背景,EMA 线才是主角。
    // 验证曲线 10 步一个点、本来就平,不需要这套。
    if (which === "train" && smooth > 0){
      const sm = ema(d.v, smooth).map((v,i)=>[px(d.s[i]), py(v)]);
      g += `<path d="${path(pts)}" fill="none" stroke="${c}" stroke-width="1" opacity=".18"/>`;
      g += `<path d="${path(sm)}" fill="none" stroke="${c}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
      lastPt = sm[sm.length-1];
    } else {
      g += `<path d="${path(pts)}" fill="none" stroke="${c}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    // 端点标记:当前值的锚,2px 底色描边把它从线上"摘"出来,不用给每个点都画点。
    g += `<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="${c}"
           stroke="var(--panel)" stroke-width="2"/>`;
    plotted.push({a: (data.arms[a]||{}).disp || a, c, s: d.s, v: d.v});
  }
  g += `<g class="hover-g"></g>`;
  chartMetas.push({W, H, PAD, xMax, px, py, series: plotted});
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>
    <div class="tt"></div></div>`;
}

function nearestIdx(arr, x){
  if (!arr.length) return -1;
  let lo = 0, hi = arr.length - 1;
  if (x <= arr[0]) return 0;
  if (x >= arr[hi]) return hi;
  while (hi - lo > 1){ const mid = (lo+hi) >> 1; arr[mid] < x ? lo = mid : hi = mid; }
  return (x - arr[lo] <= arr[hi] - x) ? lo : hi;
}

// crosshair + 每系列读数,鼠标/触摸都走这条路径。悬浮态只画在 hover-g 里,
// 不改静态渲染,所以跟 legend 的显隐切换互不干扰。
function wireHover(box, meta){
  if (!box || !meta) return;
  const svg = box.querySelector("svg"), tt = box.querySelector(".tt");
  const hoverG = svg.querySelector(".hover-g");
  const {W, H, PAD, xMax, px, py, series} = meta;

  function move(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    const r = svg.getBoundingClientRect();
    const ux = (t.clientX - r.left) / r.width * W;
    if (ux < PAD.l || ux > W - PAD.r){ leave(); return; }
    const sHover = (ux - PAD.l) / (W - PAD.l - PAD.r) * xMax;

    let dots = `<line x1="${ux.toFixed(1)}" y1="${PAD.t}" x2="${ux.toFixed(1)}" y2="${H-PAD.b}"
      stroke="var(--axis)" stroke-width="1" stroke-dasharray="3,3"/>`;
    let rows = "", step0 = null;
    for (const {a, c, s, v} of series){
      const idx = nearestIdx(s, sHover);
      if (idx < 0) continue;
      const step = s[idx], val = v[idx];
      if (step0 === null) step0 = step;
      dots += `<circle cx="${px(step).toFixed(1)}" cy="${py(val).toFixed(1)}" r="3.5"
        fill="${c}" stroke="var(--panel)" stroke-width="1.5"/>`;
      rows += `<div class="row"><span class="key" style="background:${c}"></span>
        <span class="nm">${a}</span><span class="val">${(val*100).toFixed(1)}%</span></div>`;
    }
    hoverG.innerHTML = dots;
    tt.innerHTML = `<div class="hd">step ${step0}</div>${rows}`;
    tt.classList.add("show");

    const boxR = box.getBoundingClientRect();
    const ttW = tt.offsetWidth, ttH = tt.offsetHeight;
    let left = t.clientX - boxR.left + 14, top = t.clientY - boxR.top - ttH - 10;
    if (left + ttW > boxR.width) left = t.clientX - boxR.left - ttW - 14;
    if (top < 0) top = t.clientY - boxR.top + 14;
    tt.style.left = `${Math.max(0,left)}px`;
    tt.style.top = `${Math.max(0,top)}px`;
  }
  function leave(){
    tt.classList.remove("show");
    hoverG.innerHTML = "";
  }
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", leave);
  svg.addEventListener("touchmove", ev => { move(ev); ev.preventDefault(); }, {passive:false});
  svg.addEventListener("touchend", leave);
}

/* ------------------------------------------------------------- 对垒面板 */
/* 纯数据驱动:标题、系列名、配色家族、线型、脚注表全部来自密文 payload
 * (publish_baselines.py 下发)。本文件与研究内容相关的字符串一个都没有 ——
 * 与臂名/QOS 名的既有约定同一条纪律。
 * 图形是"质量-算力"散点连线:x/y 都不从 0 起,niceTicks 用不上,
 * 自带一个任意区间的刻度器。 */
let blMetas = [];

function rngTicks(a, b, n){
  const raw = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  const out = [];
  for (let v = Math.ceil(a/step)*step; v <= b + 1e-9; v += step) out.push(v);
  return out;
}

function blChart(panel, pi){
  const {W, H, PAD} = dims();
  const P = {t:PAD.t, r:PAD.r, b:PAD.b, l:PAD.l + 6};   // y 轴是 3 位小数,多让 6px
  const vis = panel.series.filter(s => !blHidden.has(pi + ":" + s.label));
  let pts = vis.flatMap(s => s.pts);
  if (panel.ref) pts = pts.concat([panel.ref]);
  if (!pts.length){
    blMetas.push(null);
    return `<div class="chartbox blbox"><svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}"
      text-anchor="middle" fill="var(--dim)" font-size="13">全部隐藏了</text></svg></div>`;
  }
  let x0 = Math.min(...pts.map(p=>p.x)), x1 = Math.max(...pts.map(p=>p.x));
  let y0 = Math.min(...pts.map(p=>p.y)), y1 = Math.max(...pts.map(p=>p.y));
  const xp = (x1-x0)*0.05 || 1, yp = (y1-y0)*0.07 || 1;
  x0 -= xp; x1 += xp; y0 -= yp; y1 += yp;
  const px = v => P.l + (v-x0)/(x1-x0) * (W-P.l-P.r);
  const py = v => H-P.b - (v-y0)/(y1-y0) * (H-P.t-P.b);

  let g = "";
  for (const t of rngTicks(y0, y1, 5)){
    g += `<line x1="${P.l}" y1="${py(t)}" x2="${W-P.r}" y2="${py(t)}"
           stroke="var(--line)" stroke-width="1"/>
          <text x="${P.l-6}" y="${py(t)+4}" text-anchor="end" fill="var(--dim)"
           font-size="10">${t.toFixed(panel.ydec)}</text>`;
  }
  for (const t of rngTicks(x0, x1, innerWidth < 640 ? 4 : 7)){
    g += `<text x="${px(t)}" y="${H-P.b+16}" text-anchor="middle" fill="var(--dim)"
           font-size="10">${Math.round(t)}</text>`;
  }
  g += `<line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}"
         stroke="var(--axis)" stroke-width="1"/>
        <text x="${W-P.r}" y="${H-P.b+28}" text-anchor="end" fill="var(--dim)"
         font-size="10">${panel.xlab} →</text>`;

  const hoverPts = [];
  for (const s of vis){
    const c = `var(--pf${s.fam})`;
    const d = s.pts.map((p,i)=>`${i?"L":"M"}${px(p.x).toFixed(1)} ${py(p.y).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${s.w}"
           ${s.dash?`stroke-dasharray="${s.dash}"`:""}
           stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>`;
    for (const p of s.pts){
      g += `<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="${s.w>=3?4:3}"
             fill="${c}" stroke="var(--panel)" stroke-width="1.8"/>`;
      hoverPts.push({X:px(p.x), Y:py(p.y), c, s, p});
    }
  }
  if (panel.ref){
    const rx = px(panel.ref.x), ry = py(panel.ref.y);
    g += `<path d="M${rx} ${ry-6} L${rx+6} ${ry} L${rx} ${ry+6} L${rx-6} ${ry} Z"
           fill="none" stroke="var(--fg2)" stroke-width="2"/>
          <text x="${rx+9}" y="${ry-7}" fill="var(--fg2)" font-size="10">
            ${panel.ref.label} ${panel.ref.y.toFixed(panel.ydec)}</text>`;
  }
  g += `<g class="hover-g"></g>`;
  blMetas.push({W, H, hoverPts, ydec: panel.ydec});
  return `<div class="chartbox blbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>
    <div class="tt"></div></div>`;
}

// 悬浮:找视口内最近的点(帕累托图上点是主角,不做 crosshair 逐列读数)
function wireBlHover(box, meta){
  if (!box || !meta) return;
  const svg = box.querySelector("svg"), tt = box.querySelector(".tt");
  const hoverG = svg.querySelector(".hover-g");
  function move(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    const r = svg.getBoundingClientRect();
    const ux = (t.clientX - r.left) / r.width * meta.W;
    const uy = (t.clientY - r.top) / r.height * meta.H;
    let best = null, bd = 1e9;
    for (const q of meta.hoverPts){
      const d = (q.X-ux)**2 + (q.Y-uy)**2;
      if (d < bd){ bd = d; best = q; }
    }
    if (!best || bd > 28*28){ leave(); return; }
    hoverG.innerHTML = `<circle cx="${best.X}" cy="${best.Y}" r="6" fill="none"
      stroke="${best.c}" stroke-width="2"/>`;
    const p = best.p;
    tt.innerHTML = `<div class="hd">${best.s.label} · r=${p.r}</div>
      <div class="row"><span class="key" style="background:${best.c}"></span>
        <span class="val">${p.y.toFixed(meta.ydec)}${p.sd?` ±${p.sd.toFixed(meta.ydec)}`:""}</span></div>
      <div class="row"><span class="nm">${Math.round(p.x)} GFLOPs · ${p.n||"?"} rep</span></div>`;
    tt.classList.add("show");
    const boxR = box.getBoundingClientRect();
    let left = t.clientX - boxR.left + 14, top = t.clientY - boxR.top - tt.offsetHeight - 10;
    if (left + tt.offsetWidth > boxR.width) left = t.clientX - boxR.left - tt.offsetWidth - 14;
    if (top < 0) top = t.clientY - boxR.top + 14;
    tt.style.left = `${Math.max(0,left)}px`;
    tt.style.top = `${Math.max(0,top)}px`;
  }
  function leave(){ tt.classList.remove("show"); hoverG.innerHTML = ""; }
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", leave);
  svg.addEventListener("touchmove", ev => { move(ev); ev.preventDefault(); }, {passive:false});
  svg.addEventListener("touchend", leave);
}

function blLegend(panel, pi){
  return `<div class="legend">` + panel.series.map(s => {
    const k = pi + ":" + s.label;
    const last = s.pts[s.pts.length-1];
    return `<div class="lg ${blHidden.has(k)?"off":""}" data-bl="${k}">
      <span class="sw" style="background:var(--pf${s.fam});
        ${s.dash?"background:repeating-linear-gradient(90deg,var(--pf"+s.fam+") 0 5px,transparent 5px 8px)":""}"></span>
      <span class="nm">${s.label}</span>
      <span class="vl">r=${last.r}: ${last.y.toFixed(panel.ydec)}</span>
    </div>`;
  }).join("") + `</div>`;
}

function blTable(panel){
  const rs = [...new Set(panel.series.flatMap(s=>s.pts.map(p=>p.r)))].sort((a,b)=>a-b);
  let h = `<tr><th>方法</th>` + rs.map(r=>`<th>r=${r}</th>`).join("") + `</tr>`;
  for (const s of panel.series){
    h += `<tr><td>${s.label}</td>` + rs.map(r=>{
      const p = s.pts.find(p=>p.r===r);
      return p ? `<td>${p.y.toFixed(panel.ydec)} <span class="gf">(${Math.round(p.x)})</span></td>`
               : `<td>—</td>`;
    }).join("") + `</tr>`;
  }
  return `<details class="bld"><summary>数据表(${panel.ylab},括号内实测 GFLOPs)</summary>
    <div class="tblw"><table class="ptbl">${h}</table></div></details>`;
}

function blPanels(bl){
  if (!bl || !bl.panels || !bl.panels.length) return "";
  let h = `<div class="ghead">${cbtn("bl")}<h2 class="gt">${bl.heading || ""}</h2>
    <span class="gs">静态扫描结果,不随轮询更新</span></div>`;
  if (isClosed("bl")) return h;
  bl.panels.forEach((pn, i) => {
    h += panelBox("bl:" + i, pn.title, pn.sub || "",
      () => blChart(pn, i) + blLegend(pn, i) + blTable(pn));
  });
  const n = bl.note;
  if (n){
    let rows = (n.rows || []).map(r =>
      `<tr>` + r.map((c,j)=>`<td${j?"":' class="tl"'}>${c}</td>`).join("") + `</tr>`).join("");
    h += panelBox("bl:note", n.title, n.text,
      () => `<div class="tblw"><table class="ptbl">
        <tr>${(n.head||[]).map(x=>`<th>${x}</th>`).join("")}</tr>${rows}</table></div>`);
  }
  return h;
}

/* ------------------------------------------------------------------ 渲染 */
let latest = null;

function dur(sec){
  if (sec < 90) return `${Math.round(sec)} 秒`;
  if (sec < 5400) return `${Math.round(sec/60)} 分钟`;
  if (sec < 172800) return `${(sec/3600).toFixed(1)} 小时`;
  return `${(sec/86400).toFixed(1)} 天`;
}
function ago(sec){ return (!sec || sec < 0) ? "—" : dur(sec) + "前"; }
function fmtAbs(ts){
  const d = new Date(ts*1000), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// pace10_s/eta 是 publish_sr.py 用 val 每 10 步的 wall_time 差算出来的
// (中位数,躲开断点续跑的排队等待),eta 是 unix 时间戳。
function paceEta(arm, curStep){
  const total = arm.epochs_total;
  if (total && curStep >= total) return {pace:"—", eta:"已完成"};
  const pace = arm.pace10_s ? dur(arm.pace10_s) : "—";
  const eta = arm.eta ? `${dur(arm.eta - Date.now()/1000)}后 · ${fmtAbs(arm.eta)}` : "—";
  return {pace, eta};
}

function legend(data, armKeys){
  const now = Date.now()/1000;
  return `<div class="legend">` + armKeys.map(a=>{
    const arm = data.arms[a] || {};
    const tr = arm.train || {s:[],v:[]};
    const va = arm.val   || {s:[],v:[]};
    const sc = arm.score || {s:[],v:[]};
    const last = tr.v.length ? ema(tr.v, smooth).slice(-1)[0] : null;
    const vlast = va.v.length ? va.v[va.v.length-1] : null;
    const slast = sc.v.length ? sc.v[sc.v.length-1] : null;
    const step = tr.s.length ? tr.s[tr.s.length-1] : 0;
    // 阈值 90 分钟,不是凭感觉:val 评测**期间完全不写标量**,而实测评测耗时
    // 中位 37 分、最长 46 分(2026-08-18 量的四条 run 的 timing_s/testing)。
    // 定 30 分钟的话,每 10 步做一次 val 就误报一次"臂停了" —— 狼来了的告警
    // 比没有告警更糟。90 分钟 ≈ 2× 实测最长评测,既躲开评测窗口又不会拖太久。
    const idle = arm.mtime ? now - arm.mtime : null;
    const stale = idle !== null && idle > 5400;
    const {pace, eta} = paceEta(arm, step);
    return `<div class="lg ${hidden.has(a)?"off":""}" data-arm="${a}">
      <span class="sw" style="background:var(${COLOR[a]})"></span>
      <span class="nm">${arm.disp || a}</span>
      <span class="vl">step ${step}${arm.epochs_total?"/"+arm.epochs_total:""}
        · train ${last===null?"—":(last*100).toFixed(1)+"%"}
        · val ${vlast===null?"—":(vlast*100).toFixed(1)+"%"}
        · score ${slast===null?"—":(slast*100).toFixed(1)+"%"}
        · 10epoch耗时 ${pace} · 预计完成 ${eta}</span>
      ${stale?`<span class="stale">${dur(idle)} 无写入</span>`:""}
    </div>`;
  }).join("") + `</div>`;
}

/* ------------------------------------------------------------- 任务进度 */
// 纯数据驱动:标签/状态全部来自解密后的 payload,本文件不含任何任务内容。
const STATE_ZH = {RUNNING:"运行中", PENDING:"排队", COMPLETED:"已完成",
                  FAILED:"失败", CANCELLED:"已取消", TIMEOUT:"超时",
                  OUT_OF_MEMORY:"内存超限", NODE_FAIL:"节点故障",
                  PREEMPTED:"被抢占", UNKNOWN:"未知"};
// 终态 = 不会再变的状态。只有这些行给 ✕:在跑/排队的任务按号隐藏太危险 ——
// 号会复用语义(续跑接班),而且"看不见但还在烧配额"正是看板要防的事。
const TERM = new Set(["COMPLETED","CANCELLED","FAILED","TIMEOUT",
                      "OUT_OF_MEMORY","NODE_FAIL","PREEMPTED","BOOT_FAIL","DEADLINE"]);
// SLURM 的时间戳形如 2026-08-19T22:00:08 → "08-19 22:00"
function fmtStamp(s){
  return (s || "").slice(5, 16).replace("T", " ");
}
// unix 秒 → "08-19 22:00"(与上面同格式,便于并排比较)
function fmtStamp2(ts){
  const d = new Date(ts*1000), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function taskRow(j){
    const s = (j.state || "UNKNOWN").split(" ")[0];
    const cls = s === "RUNNING" ? "run" : s === "PENDING" ? "wait"
              : (s === "COMPLETED" || s === "CANCELLED") ? "done" : "bad";
    // 三类"预计"可靠性差一个数量级,分开渲染 —— 不能让预估冒充事实:
    //   进度ETA(按实测步进节奏算)  > 墙钟到期(硬事实,但答的是"何时被砍")
    //   > SLURM 起跑预估(实测漂过四次,标灰并注明)
    // 主角是「预计完成」。推算方式的可靠性递减,用不同底纹标出来,
    // 让人一眼看出哪个数能当真 —— 而不是把四种来源混成一个看似确定的时刻。
    const SRC = {
      step:  ["按实测步进节奏",   "best"],
      hist:  ["按同类作业实测时长", "ok"],
      chain: ["前序完成 + 本任务时长", "ok"],
      queue: ["SLURM 起跑预估 + 时长(预估会大幅漂移)", "weak"],
    };
    const bits = [];
    if (j.kind === "service"){
      bits.push(`<span class="soft">常驻服务 · 跑到活干完为止</span>`);
      if (j.elapsed && j.elapsed !== "00:00:00") bits.push(`已跑 ${j.elapsed}`);
    } else {
      if (j.finish){
        const [why, lvl] = SRC[j.finish_src] || ["", "ok"];
        const left = j.finish - Date.now()/1000;
        bits.push(`<span class="fin ${lvl}" title="${why}">预计完成 `
          + `<b>${fmtStamp2(j.finish)}</b>`
          + (left > 0 ? ` · ${dur(left)}后` : "") + `</span>`);
      }
      if (s === "RUNNING"){
        const pr = j.progress;
        if (pr && pr.step != null) bits.push(`${pr.step}/${pr.total} 步`);
        if (j.elapsed && j.elapsed !== "00:00:00") bits.push(`已跑 ${j.elapsed}`);
      } else if (s === "PENDING"){
        if (j.after) bits.push(`<span class="soft">排在「${j.after}」之后</span>`);
        else if (j.reason && j.reason !== "None") bits.push(`<span class="soft">${j.reason}</span>`);
      }
    }
    if (j.note) bits.push(`<span class="soft">${j.note}</span>`);
    // ✕ 只给终态行;点掉的作业号记进 localStorage,永久不再显示(可整体恢复)
    const x = TERM.has(s)
      ? `<button class="xbtn" data-x="${j.id}" title="从看板永久隐藏(面板底部可恢复)">✕</button>` : "";
    return `<tr><td class="tl">${j.label || j.id}</td>
      <td><span class="st ${cls}">${STATE_ZH[s] || s}</span></td>
      <td class="tx">${bits.join(" · ")}</td><td class="xc">${x}</td></tr>`;
}

function tasksPanel(data){
  const t = data.tasks;
  if (!t || !t.jobs || !t.jobs.length) return "";
  // 推送端已按提交时间倒序;这里再排一遍,兼容没有 submit 字段的旧密文
  const all = t.jobs.slice().sort((a,b) => (b.submit||0) - (a.submit||0));
  const jobs = all.filter(j => !dismissed.has(String(j.id)));
  const nx = all.length - jobs.length;
  // 分类由密文的 cat 字段下发(gpu=申请了 GPU 的训练任务,svc=看门狗/服务);
  // 旧密文没有 cat 时按 kind 兜底。两栏各自可折叠。
  const cat = j => j.cat || (j.kind === "service" ? "svc" : "gpu");
  let body = "";
  for (const [ck, cl] of [["gpu", "GPU 训练"], ["svc", "看门狗 / 常驻服务(无 GPU)"]]){
    const rows = jobs.filter(j => cat(j) === ck);
    if (!rows.length) continue;
    const k = "t:" + ck;
    body += `<div class="tsec">${cbtn(k)}<span>${cl}</span><span class="soft">${rows.length} 项</span></div>`;
    if (!isClosed(k))
      body += `<table class="tasks"><tbody>${rows.map(taskRow).join("")}</tbody></table>`;
  }
  const foot = [];
  if (nx) foot.push(`你已 ✕ 隐藏 ${nx} 项(<a href="#" id="undismiss">全部恢复</a>)`);
  if (t.hidden) foot.push(`更早的 ${t.hidden} 项终态作业未下发`);
  if (foot.length) body += `<p class="sub" style="margin:8px 0 2px">${foot.join(" · ")}</p>`;
  return panelBox("t", "任务进度",
    `SLURM 实时状态 · 近 14 天提交的作业自动收录 · 采集于 ${ago(Date.now()/1000 - t.updated)}`,
    () => body);
}

/* ------------------------------------------------------------- 资源占用 */
// 统计**全组**的占用(0827 改:此前只统计本人,组里别人把内存额度
// 占到 96% 时面板还显示 0%,自己的作业被挤在队里排几小时都看不出来)。
// 本人的份额由密文里的 mine_* 字段下发,在作业数下面单列一行小字;
// 旧密文没有这些字段,渲染时要判空。
function bar(used, quota, unit){
  if (!quota) return `<span class="soft">${used}${unit}(该 QOS 无此配额)</span>`;
  const pct = Math.min(100, used / quota * 100);
  const lvl = pct >= 85 ? "bad" : pct >= 60 ? "wait" : "run";
  return `<span class="qnum">${used}${unit} <span class="soft">/ ${quota}${unit}</span></span>
    <span class="qbar"><i style="width:${pct.toFixed(1)}%;background:var(--${lvl})"></i></span>
    <span class="soft">${pct.toFixed(0)}%</span>`;
}
function usagePanel(data){
  const u = data.usage;
  if (!u || !u.by_qos) return "";
  // ⚠️ QOS 名是组账户名(PI 姓名),**不能**硬编进这个公开仓库。
  // 显示用的标签由加密 payload 里的 v.label 下发;缺了就退回中性文案,
  // 绝不回落成 q 本身 —— 那正是要藏的东西。
  const rows = Object.entries(u.by_qos).map(([q, v], i) => `<tr>
      <td class="tl">${v.label || ("配额 " + (i+1))}<br><span class="soft">全组 ${v.n} 个作业在跑${
        v.mine_n != null ? `,我 ${v.mine_n} 个(${v.mine_mem_g}G${v.mine_gpu ? ` · GPU ${v.mine_gpu} 张` : ""})` : ""}</span></td>
      <td class="qcell">内存 ${bar(v.mem_g, v.quota_mem_g, "G")}</td>
      <td class="qcell">GPU ${bar(v.gpu, v.quota_gpu, " 张")}</td>
    </tr>`).join("");
  return panelBox("u", "全组资源占用",
    `统计全组作业(旧密文只含本人,此时数字偏小) ·
      采集于 ${ago(Date.now()/1000 - u.updated)} ·
      口径是<b>申请值</b>(SLURM 按申请整块划走,实际用多少都一样占配额) ·
      百分比高 = 额度被占满,新作业要排队 —— 不管占的人是不是我`,
    () => `<table class="tasks"><tbody>${rows}</tbody></table>`);
}

// 一个任务组的三块面板。val/score 是 ScienceWorld 的 partial-credit 口径,
// ALFWorld 根本不写这个 tag ⟹ 整组都没有 score 数据时不摆这块面板,
// 免得"暂无数据"被读成"这组还没评"。
function groupPanels(data, g){
  // 折叠键用组 key(密文下发的短代号,localStorage 里不落研究内容全名)
  const gk = "g:" + (g.key || "_");
  const head = `<div class="ghead">${cbtn(gk)}<h2 class="gt">${g.label || "曲线"}</h2>
      <span class="gs">${g.arms.length} 臂</span></div>`;
  if (isClosed(gk)) return head;                 // 组折叠 = 整组面板都不渲染
  const hasScore = g.arms.some(a => ((((data.arms[a]||{}).score)||{}).s||[]).length);
  return head
    + panelBox(gk + ":val", "验证 SR",
        "val/success_rate · 每 10 步一次 · 这条才是可写进论文的口径",
        () => chart(data, g.arms, "val", 0, hidden) + legend(data, g.arms))
    + (hasScore ? panelBox(gk + ":score", "验证 Score",
        `val/score · 同一批评测的 partial-credit 分数 ·
        SR 还卡在 0 的时候它已经能分出高下`,
        () => chart(data, g.arms, "score", 0, hidden)) : "")
    + panelBox(gk + ":train", "训练 SR",
        "episode/success_rate · 每步 · 细线原始,粗线 EMA",
        () => chart(data, g.arms, "train", smooth, hidden)
          + `<div class="ctl"><span>平滑</span>
        <input type="range" class="smr" min="0" max="0.98" step="0.02" value="${smooth}">
        <span class="smv">${smooth.toFixed(2)}</span></div>`);
}

function render(data){
  latest = data;
  refreshGroups(data);
  $("#stamp").textContent = `数据更新于 ${ago(Date.now()/1000 - data.updated)}`;
  chartMetas = [];             // chart() 按面板出现顺序往里 push,下面按同一顺序接 hover
  blMetas = [];
  root.innerHTML = usagePanel(data) + tasksPanel(data)
    + GROUPS.map(g => groupPanels(data, g)).join("")
    + blPanels(data._bl);

  // SR 图和对垒图各有一套 meta 与 hover 逻辑,靠 .blbox 类分流
  root.querySelectorAll(".chartbox:not(.blbox)").forEach((box, i) => wireHover(box, chartMetas[i]));
  root.querySelectorAll(".blbox").forEach((box, i) => wireBlHover(box, blMetas[i]));

  root.querySelectorAll(".lg").forEach(el=>{
    el.onclick = () => {
      if (el.dataset.bl !== undefined){
        const k = el.dataset.bl;
        flag("b", k, !blHidden.has(k));
      } else {
        const a = el.dataset.arm;
        flag("h", a, !hidden.has(a));
      }
      commit(); render(latest);
    };
  });
  // 每组一个平滑滑块(id 会重复,所以用 class);它们共用同一个全局
  // smooth —— 拖任意一个,重渲染时其余的跟着回正。
  root.querySelectorAll(".smr").forEach(el=>{
    el.oninput = e => { setItem("smooth", +e.target.value); commit(); render(latest); };
  });
  // 折叠钮:面板/大类/任务分栏共用一套;状态跟着同步到另一台设备
  root.querySelectorAll(".cbtn").forEach(el=>{
    el.onclick = () => {
      const k = el.dataset.c;
      flag("c", k, !collapsed.has(k));
      commit(); render(latest);
    };
  });
  // ✕:终态任务永久隐藏(按作业号记,恢复走面板底部"全部恢复")
  root.querySelectorAll(".xbtn").forEach(el=>{
    el.onclick = () => {
      flag("d", String(el.dataset.x), true);
      commit(); render(latest);
    };
  });
  const ud = root.querySelector("#undismiss");
  if (ud) ud.onclick = ev => {
    ev.preventDefault();
    // 逐条写墓碑,不是清空 —— 清空的话另一端那份 v:1 会在下次合并时
    // 把这些作业重新藏起来,"全部恢复"就成了刷新一下又没了。
    [...dismissed].forEach(id => flag("d", id, false));
    commit(); render(latest);
  };
}

function showError(e){
  $("#stamp").textContent = "";
  if (e.kind === "setup"){
    root.innerHTML = `<div class="msg">
      <b>缺参数。</b>这个页面本身不含任何数据来源 —— gist 地址和解密密钥都在书签
      URL 的 <code>#</code> 片段里,而片段不会发给任何服务器。<br><br>
      正确的地址形如:<br>
      <code>${location.origin}${location.pathname}#g=你的登录名/gist_id&amp;k=密钥&amp;t=写入token</code>
      <br><br>前两个值由集群上的 <code>publish_sr.py --create-gist</code> 生成,完整书签用
      <code>publish_sr.py --bookmark</code> 取。<code>t=</code> 可选,给了才能把
      折叠/隐藏这类界面操作同步到你的另一台设备。</div>`;
  } else if (e.kind === "key"){
    root.innerHTML = `<div class="msg err"><b>解不开。</b>密钥(<code>#k=</code>)与
      推上去的数据对不上 —— 多半是换过密钥后没更新书签,或 URL 被截断过。</div>`;
  } else if (e.kind === "empty"){
    root.innerHTML = `<div class="msg">gist 里还没有密文。集群上先跑一次
      <code>publish_sr.py --once</code>。</div>`;
  } else {
    root.innerHTML = `<div class="msg err"><b>取不到数据。</b>${e.msg || e}</div>`;
  }
}

async function tick(){
  try { render(await load()); }
  catch(e){ if (latest && (e.kind === "http")) return; showError(e); }
}
let rz;
addEventListener("resize", () => {          // 转屏要换 viewBox 档位,否则图停在旧比例
  clearTimeout(rz);
  rz = setTimeout(() => { if (latest) render(latest); }, 200);
});
$("#refresh").onclick = tick;
// 点指示器 = 立刻收一次 + 立刻发一次(不等 60s 轮询,也不等 1.2s 防抖)
$("#sync").onclick = () => { tick(); clearTimeout(pushT); pushState(); };
addEventListener("hashchange", tick);
setSync(hashParams().t ? "idle" : "ro");
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SW SR</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --line:#262c36; --fg:#e6edf3; --dim:#8b949e;
  --grpo:#7aa2f7; --gigpo:#e0af68; --hgpo:#9ece6a; --spectral:#f7768e;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#ffffff; --panel:#f6f8fa; --line:#d8dee4; --fg:#1f2328; --dim:#656d76;
         --grpo:#2f6feb; --gigpo:#9a6700; --hgpo:#1a7f37; --spectral:#cf222e; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 14px 8px;margin-bottom:14px}
.panel h2{font-size:13px;margin:0 0 2px;font-weight:600}
.panel .sub{font-size:11px;color:var(--dim);margin:0 0 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px}
.lg{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  padding:2px 0;font-variant-numeric:tabular-nums}
.lg.off{opacity:.32}
.sw{width:20px;height:3px;border-radius:2px;flex:none}
.lg .nm{font-weight:600;min-width:62px}
.lg .vl{color:var(--dim)}
.lg .stale{color:var(--spectral);font-size:11px;white-space:nowrap}
@media (max-width:640px){
  .legend{gap:2px 0}
  .lg{width:100%}                       /* 一臂一行,拇指也点得中 */
  .lg .vl{font-size:11px}
  .wrap{padding:12px 10px}
}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:4px}
input[type=range]{width:130px;accent-color:var(--grpo)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;
  line-height:1.75}
.msg code{background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font-size:12px;word-break:break-all}
.err{color:var(--spectral)}
.tip{fill:var(--fg);font-size:11px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ScienceWorld · 四臂 SR</h1>
    <span class="meta" id="stamp"></span>
    <span class="spacer"></span>
    <button id="refresh">刷新</button>
  </header>
  <div id="root"><div class="msg">载入中…</div></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------ 配置
 * gist 地址与密钥都从 URL 的 # 片段读,页面源码里一个都不写死。
 *   · fragment 永远不会随 HTTP 请求发出(GitHub Pages / gist CDN 都看不到);
 *   · 因此这个公开页面本身不泄露"数据在哪"和"怎么解开",
 *     陌生人打开只会看到下面那段"缺参数"提示。
 * 书签形如:  .../#g=<gist登录名>/<gist_id>&k=<base64url密钥>
 */
const FILE = "sw_sr.json";
const POLL_MS = 60000;
const ARMS = ["grpo", "gigpo", "hgpo", "spectral"];
const COLOR = {grpo:"--grpo", gigpo:"--gigpo", hgpo:"--hgpo", spectral:"--spectral"};

const $ = s => document.querySelector(s);
const root = $("#root");

function hashParams(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  return {g: h.get("g"), k: h.get("k")};
}

/* ------------------------------------------------------------------ 解密 */
function unb64u(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(s + "=".repeat((4 - s.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function decrypt(envelope, keyB64){
  const key = await crypto.subtle.importKey(
    "raw", unb64u(keyB64), {name:"AES-GCM"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv: unb64u(envelope.iv)}, key, unb64u(envelope.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ------------------------------------------------------------------ 取数 */
async function load(){
  const {g, k} = hashParams();
  if (!g || !k) throw {kind:"setup"};
  // gist raw 带 max-age=300 的 CDN 缓存:cache-buster + no-store 一起用,
  // 但最坏情况仍可能落后一个 CDN 周期(推送本身是 120s 一次,可接受)。
  const url = `https://gist.githubusercontent.com/${g}/raw/${FILE}?t=${Date.now()}`;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw {kind:"http", msg:`gist 返回 ${r.status}`};
  const env = await r.json();
  if (!env.iv || !env.ct) throw {kind:"empty"};
  try { return await decrypt(env, k); }
  catch(e){ throw {kind:"key"}; }
}

/* ------------------------------------------------------------------ 画图 */
/* viewBox 的宽高比决定了手机上图有多高:900x300 在 390px 宽屏上只剩 130px,
 * 曲线全糊成一团。窄屏换一套更方的 viewBox,字号也因此相对变大。 */
function dims(){
  return innerWidth < 640
    ? {W:420, H:300, PAD:{t:10, r:10, b:26, l:34}}
    : {W:900, H:300, PAD:{t:12, r:14, b:30, l:44}};
}

function ema(vals, alpha){
  if (alpha <= 0) return vals.slice();
  const out = []; let acc = null;
  for (const v of vals){ acc = acc === null ? v : alpha*acc + (1-alpha)*v; out.push(acc); }
  return out;
}
function niceTicks(max, n){
  const raw = max/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  const out = []; for (let v=0; v<=max+1e-9; v+=step) out.push(v);
  return out;
}
function path(pts){
  return pts.length ? "M" + pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("L") : "";
}

function chart(data, which, smooth, hidden){
  const {W, H, PAD} = dims();
  const series = ARMS
    .map(a => ({a, d: (data.arms[a]||{})[which] || {s:[],v:[]}}))
    .filter(o => o.d.s.length && !hidden.has(o.a));

  if (!series.length)
    return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}"
      text-anchor="middle" fill="var(--dim)" font-size="13">暂无数据</text></svg>`;

  const xMax = Math.max(...series.map(o => o.d.s[o.d.s.length-1]), 1);
  const yRaw = Math.max(...series.map(o => Math.max(...o.d.v)), 0.05);
  const yMax = Math.min(1, Math.ceil(yRaw*1.15*20)/20);

  const px = s => PAD.l + (s/xMax) * (W-PAD.l-PAD.r);
  const py = v => H-PAD.b - (v/yMax) * (H-PAD.t-PAD.b);

  let g = "";
  for (const t of niceTicks(yMax, 4)){
    const y = py(t);
    g += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}"
           stroke="var(--line)" stroke-width="1"/>
          <text x="${PAD.l-7}" y="${y+4}" text-anchor="end" fill="var(--dim)"
           font-size="10">${(t*100).toFixed(0)}%</text>`;
  }
  for (const t of niceTicks(xMax, 5)){
    if (t === 0) continue;
    const x = px(t);
    g += `<text x="${x}" y="${H-PAD.b+16}" text-anchor="middle" fill="var(--dim)"
           font-size="10">${t}</text>`;
  }
  g += `<line x1="${PAD.l}" y1="${H-PAD.b}" x2="${W-PAD.r}" y2="${H-PAD.b}"
         stroke="var(--line)" stroke-width="1"/>`;

  for (const {a, d} of series){
    const c = `var(${COLOR[a]})`;
    const pts = d.s.map((s,i)=>[px(s), py(d.v[i])]);
    // 训练曲线一步一个点、抖动很大 ⟹ 原始线压到 18% 当背景,EMA 线才是主角。
    // 验证曲线 10 步一个点、本来就平,不需要这套。
    if (which === "train" && smooth > 0){
      const sm = ema(d.v, smooth).map((v,i)=>[px(d.s[i]), py(v)]);
      g += `<path d="${path(pts)}" fill="none" stroke="${c}" stroke-width="1" opacity=".18"/>`;
      g += `<path d="${path(sm)}" fill="none" stroke="${c}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    } else {
      g += `<path d="${path(pts)}" fill="none" stroke="${c}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
      if (which === "val" || which === "score")
        g += pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="${c}"/>`).join("");
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

/* ------------------------------------------------------------------ 渲染 */
const hidden = new Set();
let smooth = 0.85, latest = null;

function dur(sec){
  if (sec < 90) return `${Math.round(sec)} 秒`;
  if (sec < 5400) return `${Math.round(sec/60)} 分钟`;
  if (sec < 172800) return `${(sec/3600).toFixed(1)} 小时`;
  return `${(sec/86400).toFixed(1)} 天`;
}
function ago(sec){ return (!sec || sec < 0) ? "—" : dur(sec) + "前"; }
function fmtAbs(ts){
  const d = new Date(ts*1000), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// pace10_s/eta 是 publish_sr.py 用 val 每 10 步的 wall_time 差算出来的
// (中位数,躲开断点续跑的排队等待),eta 是 unix 时间戳。
function paceEta(arm, curStep){
  const total = arm.epochs_total;
  if (total && curStep >= total) return {pace:"—", eta:"已完成"};
  const pace = arm.pace10_s ? dur(arm.pace10_s) : "—";
  const eta = arm.eta ? `${dur(arm.eta - Date.now()/1000)}后 · ${fmtAbs(arm.eta)}` : "—";
  return {pace, eta};
}

function legend(data){
  const now = Date.now()/1000;
  return `<div class="legend">` + ARMS.map(a=>{
    const arm = data.arms[a] || {};
    const tr = arm.train || {s:[],v:[]};
    const va = arm.val   || {s:[],v:[]};
    const sc = arm.score || {s:[],v:[]};
    const last = tr.v.length ? ema(tr.v, smooth).slice(-1)[0] : null;
    const vlast = va.v.length ? va.v[va.v.length-1] : null;
    const slast = sc.v.length ? sc.v[sc.v.length-1] : null;
    const step = tr.s.length ? tr.s[tr.s.length-1] : 0;
    // 阈值 90 分钟,不是凭感觉:val 评测**期间完全不写标量**,而实测评测耗时
    // 中位 37 分、最长 46 分(2026-08-18 量的四条 run 的 timing_s/testing)。
    // 定 30 分钟的话,每 10 步做一次 val 就误报一次"臂停了" —— 狼来了的告警
    // 比没有告警更糟。90 分钟 ≈ 2× 实测最长评测,既躲开评测窗口又不会拖太久。
    const idle = arm.mtime ? now - arm.mtime : null;
    const stale = idle !== null && idle > 5400;
    const {pace, eta} = paceEta(arm, step);
    return `<div class="lg ${hidden.has(a)?"off":""}" data-arm="${a}">
      <span class="sw" style="background:var(${COLOR[a]})"></span>
      <span class="nm">${a}</span>
      <span class="vl">step ${step}${arm.epochs_total?"/"+arm.epochs_total:""}
        · train ${last===null?"—":(last*100).toFixed(1)+"%"}
        · val ${vlast===null?"—":(vlast*100).toFixed(1)+"%"}
        · score ${slast===null?"—":(slast*100).toFixed(1)+"%"}
        · 10epoch耗时 ${pace} · 预计完成 ${eta}</span>
      ${stale?`<span class="stale">${dur(idle)} 无写入</span>`:""}
    </div>`;
  }).join("") + `</div>`;
}

function render(data){
  latest = data;
  $("#stamp").textContent = `数据更新于 ${ago(Date.now()/1000 - data.updated)}`;
  root.innerHTML = `
    <div class="panel">
      <h2>验证 SR</h2>
      <p class="sub">val/success_rate · 每 10 步一次 · 这条才是可写进论文的口径</p>
      ${chart(data, "val", 0, hidden)}
      ${legend(data)}
    </div>
    <div class="panel">
      <h2>验证 Score</h2>
      <p class="sub">val/score · 同一批评测的 partial-credit 分数 ·
        SR 还卡在 0 的时候它已经能分出高下</p>
      ${chart(data, "score", 0, hidden)}
    </div>
    <div class="panel">
      <h2>训练 SR</h2>
      <p class="sub">episode/success_rate · 每步 · 细线原始,粗线 EMA</p>
      ${chart(data, "train", smooth, hidden)}
      <div class="ctl"><span>平滑</span>
        <input type="range" id="sm" min="0" max="0.98" step="0.02" value="${smooth}">
        <span id="smv">${smooth.toFixed(2)}</span></div>
    </div>`;

  root.querySelectorAll(".lg").forEach(el=>{
    el.onclick = () => {
      const a = el.dataset.arm;
      hidden.has(a) ? hidden.delete(a) : hidden.add(a);
      render(latest);
    };
  });
  const sm = $("#sm");
  if (sm) sm.oninput = e => { smooth = +e.target.value; render(latest); };
}

function showError(e){
  $("#stamp").textContent = "";
  if (e.kind === "setup"){
    root.innerHTML = `<div class="msg">
      <b>缺参数。</b>这个页面本身不含任何数据来源 —— gist 地址和解密密钥都在书签
      URL 的 <code>#</code> 片段里,而片段不会发给任何服务器。<br><br>
      正确的地址形如:<br>
      <code>${location.origin}${location.pathname}#g=你的登录名/gist_id&amp;k=密钥</code>
      <br><br>这两个值由集群上的 <code>publish_sr.py --create-gist</code> 打印。</div>`;
  } else if (e.kind === "key"){
    root.innerHTML = `<div class="msg err"><b>解不开。</b>密钥(<code>#k=</code>)与
      推上去的数据对不上 —— 多半是换过密钥后没更新书签,或 URL 被截断过。</div>`;
  } else if (e.kind === "empty"){
    root.innerHTML = `<div class="msg">gist 里还没有密文。集群上先跑一次
      <code>publish_sr.py --once</code>。</div>`;
  } else {
    root.innerHTML = `<div class="msg err"><b>取不到数据。</b>${e.msg || e}</div>`;
  }
}

async function tick(){
  try { render(await load()); }
  catch(e){ if (latest && (e.kind === "http")) return; showError(e); }
}
let rz;
addEventListener("resize", () => {          // 转屏要换 viewBox 档位,否则图停在旧比例
  clearTimeout(rz);
  rz = setTimeout(() => { if (latest) render(latest); }, 200);
});
$("#refresh").onclick = tick;
addEventListener("hashchange", tick);
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
